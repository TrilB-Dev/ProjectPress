name: ProjectPress QA

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: PHP syntax
        run: find src Test -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        run: composer test
      - name: Coding standards
        run: composer lint
